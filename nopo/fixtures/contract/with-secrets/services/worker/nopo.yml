name: worker
description: "Service with flat-shape runtime + a single secret. Exercises the auto-wrap path (flat -> { default: <flat> })."
tags: [secrets]

build:
  command: echo "build worker"

# Flat-shape runtime. Auto-wrapped to `{ default: <flat> }` by the parser.
# QUEUE_TOKEN decrypts to "test-queue-token-default" with the dummy identity.
runtime:
  command: echo "run worker"
  port: 4000
  cpu: "0.25"
  memory: "128Mi"
  secrets:
    QUEUE_TOKEN: "ENC[AES256_GCM,data:Q8+0lZezz1Xj2shpvRgvsfDq7lxlAxi7,iv:5VwPS0qkQtlmoszr,tag:KFbrBQdy+qU0G7PZneN3EA==,key:,type:str]"
