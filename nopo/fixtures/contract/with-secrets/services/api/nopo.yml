name: api
description: Service with map-shape runtime + secrets in default and prod overlays.
tags: [secrets]

build:
  command: echo "build api"

# Map-shape runtime to exercise overlay merging of secrets:
#   - default.secrets.API_KEY      -> "test-api-key-default"
#   - prod.secrets.API_KEY         -> "test-api-key-prod"      (overrides default)
#   - prod.secrets.DB_PASSWORD     -> "test-db-password-prod"  (added in prod)
#
# All values were encrypted with the dummy age recipient documented in
# ../README.md. Tests load the dummy identity from ../dummy-identity.txt
# and assert decryption matches the plaintext above.
runtime:
  default:
    command: echo "run api"
    port: 3000
    cpu: "0.5"
    memory: "256Mi"
    secrets:
      API_KEY: "ENC[AES256_GCM,data:yVJImKUryuOF1cXMMtAXVmP+GXY=,iv:k1EHXHVLgEp+/FPI,tag:746YzNlNuelUS2lWiAXhmA==,key:,type:str]"
  prod:
    cpu: "1"
    memory: "512Mi"
    secrets:
      API_KEY: "ENC[AES256_GCM,data:ssGPaXZUh3iezJyo/2t03M4=,iv:wc3JhwxP2u+pQUYx,tag:CRW1p1PbXFw9n72NhyTdpQ==,key:,type:str]"
      DB_PASSWORD: "ENC[AES256_GCM,data:VFb5yr/0FmLS7plGPTBKTTnsz/N/,iv:cSzFOsEJkaYp+Yzn,tag:Hax0GVbb4POYqND3A/dUmA==,key:,type:str]"
