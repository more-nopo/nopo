name: canary

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [synchronize, closed]

permissions:
  contents: read
  packages: write
  pull-requests: write
  issues: write

jobs:
  arm:
    if: >
      github.event_name == 'issue_comment'
      && github.event.issue.pull_request
      && startsWith(github.event.comment.body, '/canary')
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.meta.outputs.pr }}
      sha: ${{ steps.meta.outputs.sha }}
      skip: ${{ steps.meta.outputs.skip }}
    steps:
      - id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          head_repo=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRepository,headRefOid,headRefName --jq '{repo: (.headRepository.nameWithOwner // .headRepository.owner.login + "/" + .headRepository.name), sha: .headRefOid, ref: .headRefName}')
          repo=$(echo "$head_repo" | jq -r .repo)
          sha=$(echo "$head_repo" | jq -r .sha)
          if [ "$repo" != "$GITHUB_REPOSITORY" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "Fork PRs do not publish canaries."
            exit 0
          fi
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label canary
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "skip=0" >> "$GITHUB_OUTPUT"
      - if: steps.meta.outputs.skip != '1'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.sha }}
      - if: steps.meta.outputs.skip != '1'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - if: steps.meta.outputs.skip != '1'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: "@more-nopo"
      - if: steps.meta.outputs.skip != '1'
        run: bun install --frozen-lockfile
      - if: steps.meta.outputs.skip != '1'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.meta.outputs.pr }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for f in .changeset/*.md; do
            [ "$(basename "$f")" = "README.md" ] && continue
            found=1
            break
          done
          if [ "$found" -eq 0 ]; then
            printf '%s\n' '---' '"@more-nopo/nopo": patch' '---' '' 'canary' > .changeset/canary-tmp.md
          fi
          bunx changeset version --snapshot "pr-${PR}"
          bunx changeset publish --tag "pr-${PR}" --no-git-tag

  republish:
    if: >
      github.event_name == 'pull_request'
      && github.event.action == 'synchronize'
      && github.event.pull_request.head.repo.full_name == github.repository
      && contains(join(github.event.pull_request.labels.*.name, ','), 'canary')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: "@more-nopo"
      - run: bun install --frozen-lockfile
      - env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for f in .changeset/*.md; do
            [ "$(basename "$f")" = "README.md" ] && continue
            found=1
            break
          done
          if [ "$found" -eq 0 ]; then
            printf '%s\n' '---' '"@more-nopo/nopo": patch' '---' '' 'canary' > .changeset/canary-tmp.md
          fi
          bunx changeset version --snapshot "pr-${PR}"
          bunx changeset publish --tag "pr-${PR}" --no-git-tag

  expire:
    if: >
      github.event_name == 'pull_request'
      && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: "@more-nopo"
      - env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          tag="pr-${PR}"
          npm dist-tag rm @more-nopo/nopo "$tag" || true
          versions=$(gh api --paginate "/orgs/more-nopo/packages/npm/nopo/versions" --jq ".[] | select(.name | test(\"${tag}\")) | .id" || true)
          for id in $versions; do
            gh api -X DELETE "/orgs/more-nopo/packages/npm/nopo/versions/${id}" || true
          done
